<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parcial</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Registro web</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="tabla.html">tabla</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="hero d-flex align-items-center">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-lg-6 text-center text-lg-start mb-4 mb-lg-0">
            <h1 class="display-4 fw-bold text-white">Bienvenido</h1>
            <p class="lead text-secondary mt-3">Bienvenido a mi pagina</p>
            <button
              class="btn btn-lg btn-primary mt-3 px-5 py-3 fw-semibold shadow-lg"
              data-bs-toggle="modal"
              data-bs-target="#registroModal"
            >
              Registrarse
            </button>
          </div>
          <div class="col-lg-6 text-center">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmO-Z5vdVaTWN1j808w_eGStCphkk_MnLqDg&s"
              alt="imagen"
              class="img-fluid rounded-4 shadow-lg hero-img"
            />
          </div>
        </div>
      </div>
    </section>

    <div class="modal fade" id="registroModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-dark">
          <div class="modal-header border-secondary">
            <h5 class="modal-title text-white fw-bold">📝 Registro</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="formRegistroModal" novalidate>
              <div class="mb-3">
                <label for="modalNombre" class="form-label text-white"
                  >Nombre completo</label
                >
                <input
                  type="text"
                  class="form-control bg-dark text-white"
                  id="modalNombre"
                  placeholder="Ej: Juan Pérez"
                />
                <div class="error-message" id="errorNombre"></div>
              </div>
              <div class="mb-3">
                <label for="modalEmail" class="form-label text-white"
                  >Correo electrónico</label
                >
                <input
                  type="email"
                  class="form-control bg-dark text-white"
                  id="modalEmail"
                  placeholder="Ej: juan@universidad.edu"
                />
                <div class="error-message" id="errorEmail"></div>
              </div>
              <div class="mb-3">
                <label for="modalTelefono" class="form-label text-white"
                  >Número de teléfono</label
                >
                <input
                  type="tel"
                  class="form-control bg-dark text-white"
                  id="modalTelefono"
                  placeholder="Ej: 1234567890"
                  maxlength="10"
                />
                <div class="error-message" id="errorTelefono"></div>
              </div>
              <div class="mb-3">
                <label for="modalPassword" class="form-label text-white"
                  >Contraseña</label
                >
                <input
                  type="password"
                  class="form-control bg-dark text-white"
                  id="modalPassword"
                  placeholder="Mínimo 6 caracteres"
                />
                <div class="error-message" id="errorPassword"></div>
              </div>
              <div class="mb-3">
                <label for="modalConfirmPassword" class="form-label text-white"
                  >Confirmar contraseña</label
                >
                <input
                  type="password"
                  class="form-control bg-dark text-white"
                  id="modalConfirmPassword"
                  placeholder="Repite la contraseña"
                />
                <div class="error-message" id="errorConfirmPassword"></div>
              </div>
            </form>
          </div>
          <div class="modal-footer border-secondary">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button type="button" class="btn btn-primary" id="btnGuardarModal">
              Registrar
            </button>
          </div>
        </div>
      </div>
    </div>

    <footer class="text-center text-secondary py-4 border-top border-secondary">
      <small>&copy; 2026 Registro web — parcial</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
