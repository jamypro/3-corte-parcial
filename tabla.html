<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>parcial</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Registro web</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="tabla.html">Ver tabla</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="py-5">
      <div class="container">
        <h2 class="text-white fw-bold mb-4">Registrar nuevo estudiante</h2>
        <form
          id="formUsuario"
          class="row g-3 bg-black p-4 rounded-4 shadow mb-5"
        >
          <div class="col-md-6">
            <label for="nombre" class="form-label text-white"
              >Nombre completo</label
            >
            <input
              type="text"
              class="form-control"
              id="nombre"
              placeholder="Ej: Juan Pérez"
              required
            />
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label text-white"
              >Correo electrónico</label
            >
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Ej: juan@universidad.edu"
              required
            />
          </div>
          <div class="col-md-6">
            <label for="matricula" class="form-label text-white"
              >Matrícula</label
            >
            <input
              type="text"
              class="form-control"
              id="matricula"
              placeholder="Ej: 2024-1234"
              required
            />
          </div>
          <div class="col-md-6">
            <label for="carrera" class="form-label text-white">Carrera</label>
            <select class="form-select" id="carrera" required>
              <option value="">Selecciona una carrera...</option>
              <option value="Ingeniería en Sistemas">
                Ingeniería en Sistemas
              </option>
              <option value="Ingeniería Civil">Ingeniería Civil</option>
              <option value="Medicina">Medicina</option>
              <option value="Derecho">Derecho</option>
              <option value="Arquitectura">Arquitectura</option>
              <option value="Administración de Empresas">
                Administración de Empresas
              </option>
              <option value="Psicología">Psicología</option>
            </select>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary px-4">
              Registrar
            </button>
            <button type="reset" class="btn btn-outline-secondary px-4 ms-2">
              Limpiar
            </button>
          </div>
        </form>

        <h2 class="text-white fw-bold mb-4">👥 Estudiantes registrados</h2>
        <div class="table-responsive">
          <table class="table table-dark table-striped align-middle">
            <thead>
              <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Teléfono</th>
                <th>Carrera</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaUsuarios"></tbody>
          </table>
        </div>
        <p id="sinUsuarios" class="text-secondary text-center mt-3">
          No hay estudiantes registrados en la base de datos.
        </p>
      </div>
    </section>

    <footer class="text-center text-secondary py-4 border-top border-secondary">
      <small>&copy; 2026 — Parcial</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
