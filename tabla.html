<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lista de usuarios registrados en el sistema de registro universitario" />
    <meta name="keywords" content="usuarios, registrados, estudiantes, lista, tabla" />
    <meta name="author" content="Registro Web" />
    <title>Usuarios — Sistema de Registro Universitario</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        <div class="container">
          <a class="navbar-brand fw-bold" href="index.html">Registro web</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="tabla.html">Ver Usuarios</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="py-5">
        <div class="container">
          <h2 class="text-white fw-bold mb-4">Usuarios registrados</h2>

          <div class="table-responsive">
            <table class="table table-dark table-striped align-middle">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Correo</th>
                  <th>Teléfono</th>
                </tr>
              </thead>
              <tbody id="tablaUsuarios"></tbody>
            </table>
          </div>

          <p id="sinUsuarios" class="text-secondary text-center fs-5 mt-4">
            No hay usuarios registrados aún.
          </p>

          <div class="text-center mt-4">
            <button
              class="btn btn-outline-primary btn-lg px-5"
              onclick="window.location.href='index.html'"
            >
              Volver al inicio
            </button>
          </div>
        </div>
      </section>
    </main>

    <footer class="text-center text-secondary py-4 border-top border-secondary">
      <small>&copy; 2026 Registro web — Sistema de Registro Universitario</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
